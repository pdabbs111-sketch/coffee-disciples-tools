<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Disciples — Facilitator</title>
<style>
  :root{
    --bg:#2b2018; --bg2:#352718; --ink:#f3ead9; --ink-dim:#c9b89c;
    --line:#4a3a27; --amber:#d9a441; --green:#7fae6f; --red:#c1604f;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){ --bg:#f7f2e8; --bg2:#efe6d4; --ink:#2b2018; --ink-dim:#6b5a42; --line:#ddcdb0; }
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;min-height:100%;}
  .wrap{max-width:560px;margin:0 auto;padding:2.5rem 1.25rem 4rem;}
  h1{font-size:1.1rem;margin:0 0 .2rem;font-weight:600;}
  .sub{color:var(--ink-dim);font-size:.82rem;margin:0 0 1.5rem;line-height:1.5;}
  .card{border:1px solid var(--line);border-radius:4px;padding:1rem;margin-bottom:1.25rem;}
  .label{font-size:.72rem;color:var(--ink-dim);margin-bottom:.35rem;}
  input[type=date],textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);padding:.5rem .6rem;border-radius:3px;font:inherit;font-size:.85rem;}
  textarea{resize:vertical;min-height:4em;}
  input:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px;}
  .member{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.9rem;}
  .member:last-child{border-bottom:0;}
  .member input{width:1.1rem;height:1.1rem;accent-color:var(--amber);}
  button,a.btn{font:inherit;cursor:pointer;border-radius:3px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:.55rem .9rem;font-size:.82rem;text-decoration:none;display:inline-block;}
  button:hover,a.btn:hover{border-color:var(--amber);}
  .primary{background:var(--amber);color:#241a10;border-color:var(--amber);font-weight:600;width:100%;padding:.75rem;font-size:.9rem;margin-top:.8rem;}
  .primary:disabled{opacity:.5;cursor:default;}
  .msg{font-size:.82rem;margin-top:.8rem;min-height:1.1em;}
  .msg.err{color:var(--red);} .msg.ok{color:var(--green);}
  .hist{font-size:.78rem;color:var(--ink-dim);line-height:1.9;}
  .hist b{color:var(--ink);font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Group Facilitator</h1>
  <p class="sub" id="sub">Loading your group…</p>
  <p id="fatal" class="msg err"></p>

  <div id="main" style="display:none;">
    <div class="card" id="info"></div>

    <div class="card">
      <div class="label">Meeting date</div>
      <input type="date" id="date">
      <div class="label" style="margin-top:1rem;">Who was there? (checked = attended)</div>
      <div id="members"></div>
      <div class="label" style="margin-top:1rem;">Notes (optional, shared with the admin)</div>
      <textarea id="notes" maxlength="500" placeholder="Anything worth flagging about how the meeting went…"></textarea>
      <button class="primary" id="saveBtn" onclick="save()">Save attendance</button>
      <p class="msg" id="msg"></p>
    </div>

    <div class="card">
      <div class="label">Past meetings</div>
      <div class="hist" id="hist">None logged yet.</div>
    </div>
  </div>
</div>

<script>
const API = "https://ijparkhwmgcynixifxcu.supabase.co/functions/v1/facilitator-portal";
const token = new URLSearchParams(location.search).get('token') || '';
let state = null;

function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function setMsg(t, k){ const m = document.getElementById('msg'); m.textContent = t || ''; m.className = 'msg' + (k ? ' ' + k : ''); }

async function load(){
  if(!token){ fail('This page needs the personal link your coordinator sent you.'); return; }
  try{
    const res = await fetch(`${API}?token=${encodeURIComponent(token)}`);
    const data = await res.json();
    if(!res.ok){ fail(data.error || 'Could not load your group.'); return; }
    state = data;
    render();
  }catch(e){ fail('Network error — check your connection and refresh.'); }
}

function fail(text){
  document.getElementById('sub').textContent = '';
  document.getElementById('fatal').textContent = text;
}

function render(){
  const g = state.group;
  document.getElementById('sub').textContent = 'Log who attended each meeting. Only you can see this page.';
  document.getElementById('main').style.display = 'block';
  const sched = [g.meeting_day, g.meeting_time ? g.meeting_time.slice(0,5) : '', g.meeting_frequency].filter(Boolean).join(' · ');
  document.getElementById('info').innerHTML =
    `<div style="font-size:.95rem;font-weight:600;">${esc(g.type || 'Small group')}</div>` +
    `<div class="label" style="margin-top:.3rem;">${esc(sched)} · ${esc(g.status)}</div>` +
    (g.meeting_link ? `<div style="margin-top:.7rem;"><a class="btn" href="${esc(g.meeting_link)}" target="_blank" rel="noopener">Open meeting room</a></div>` : '');

  const today = new Date(); today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
  document.getElementById('date').value = today.toISOString().slice(0,10);
  document.getElementById('date').addEventListener('change', fillChecks);
  document.getElementById('members').innerHTML = state.members.map(m =>
    `<label class="member"><input type="checkbox" data-id="${esc(m.id)}" checked> ${esc(m.first_name)}</label>`).join('');
  fillChecks();
  renderHistory();
}

function fillChecks(){
  const d = document.getElementById('date').value;
  const existing = state.history.filter(h => h.meeting_date === d);
  document.querySelectorAll('#members input').forEach(cb => {
    const rec = existing.find(h => h.member_id === cb.dataset.id);
    cb.checked = rec ? rec.attended : true;
  });
}

function renderHistory(){
  const byDate = {};
  state.history.forEach(h => { (byDate[h.meeting_date] ||= []).push(h); });
  const dates = Object.keys(byDate).sort().reverse().slice(0, 12);
  document.getElementById('hist').innerHTML = dates.length
    ? dates.map(d => `<div><b>${esc(d)}</b> — ${byDate[d].filter(h => h.attended).length} of ${byDate[d].length} attended</div>`).join('')
    : 'None logged yet.';
}

async function save(){
  const btn = document.getElementById('saveBtn');
  const date = document.getElementById('date').value;
  if(!date){ setMsg('Pick the meeting date first.', 'err'); return; }
  const records = [...document.querySelectorAll('#members input')].map(cb => ({ member_id: cb.dataset.id, attended: cb.checked }));
  btn.disabled = true; setMsg('Saving…');
  try{
    const res = await fetch(`${API}?token=${encodeURIComponent(token)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ meeting_date: date, records, notes: document.getElementById('notes').value.trim() })
    });
    const data = await res.json();
    if(!res.ok){ setMsg(data.error || 'Could not save.', 'err'); }
    else {
      setMsg(data.result || 'Saved.', 'ok');
      state.history = state.history.filter(h => h.meeting_date !== date).concat(records.map(r => ({ meeting_date: date, member_id: r.member_id, attended: r.attended })));
      renderHistory();
    }
  }catch(e){ setMsg('Network error — try again.', 'err'); }
  btn.disabled = false;
}

load();
</script>
</body>
</html>
